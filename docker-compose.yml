version: "3.8"

services:
  # ── Webhook Server (Node.js) ──────────────────────────
  webhook:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: wa-webhook
    restart: unless-stopped
    environment:
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BUSINESS_NAME: ${BUSINESS_NAME}
      BUSINESS_DESCRIPTION: ${BUSINESS_DESCRIPTION}
      BUSINESS_WEBSITE: ${BUSINESS_WEBSITE}
      BUSINESS_HOURS_START: ${BUSINESS_HOURS_START}
      BUSINESS_HOURS_END: ${BUSINESS_HOURS_END}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE}
      READ_DELAY_MIN: ${READ_DELAY_MIN}
      READ_DELAY_MAX: ${READ_DELAY_MAX}
      TYPING_DELAY_MIN: ${TYPING_DELAY_MIN}
      TYPING_DELAY_MAX: ${TYPING_DELAY_MAX}
      SPLIT_DELAY_MIN: ${SPLIT_DELAY_MIN}
      SPLIT_DELAY_MAX: ${SPLIT_DELAY_MAX}
      SPLIT_PROBABILITY: ${SPLIT_PROBABILITY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3010:3000"
      - "${ADMIN_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wa-network
    volumes:
      - ./backups:/app/backups

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_auto}
      POSTGRES_USER: ${POSTGRES_USER:-whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_password_segura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - wa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatsapp} -d ${POSTGRES_DB:-whatsapp_auto}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cloudflare Tunnel (expone webhook HTTPS gratis) ──
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wa-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - wa-network
    depends_on:
      - webhook

networks:
  wa-network:
    driver: bridge

volumes:
  postgres_data:
