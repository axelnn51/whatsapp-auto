<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDKeysPeru — Editor de Flujos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a25;
            --border: #2a2a3a; --text: #e4e4ed; --text-muted: #8888a0;
            --accent: #25D366; --accent-dim: #1a9e4a;
            --red: #ef4444; --blue: #3b82f6; --gold: #f59e0b;
            --radius: 12px;
        }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .header h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header h1 span { color: var(--accent); }

        .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn:hover { border-color: var(--accent); background: var(--surface2); }
        .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
        .btn-accent:hover { background: var(--accent-dim); }
        .btn-red { border-color: var(--red); color: var(--red); }
        .btn-red:hover { background: rgba(239,68,68,0.1); }

        .container { max-width: 900px; margin: 0 auto; padding: 24px; }

        .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .editor-container {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 20px;
        }

        #json-editor {
            width: 100%;
            height: 600px;
            background: var(--bg);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        #json-editor:focus {
            outline: none;
            border-color: var(--accent);
        }

        .save-bar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .save-status { font-size: 13px; color: var(--text-muted); }
        .save-status.saved { color: var(--accent); }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 <span>Editor de Flujos (JSON)</span></h1>
        <a href="/" class="btn">← Volver al Dashboard</a>
    </div>

    <div class="container" id="editor">
        <div class="section">
            <div class="section-title">⚠️ Editor Avanzado de Embudo de Ventas</div>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
                Aquí puedes editar todos los mensajes, precios y palabras clave del embudo de ventas. 
                Asegúrate de mantener el formato JSON válido.
            </p>
            <div class="editor-container">
                <textarea id="json-editor" oninput="markDirty()"></textarea>
            </div>
        </div>
    </div>

    <div class="save-bar">
        <div class="save-status" id="save-status">Sin cambios</div>
        <div style="display:flex;gap:12px">
            <button class="btn btn-accent" onclick="saveAllFlows()">💾 Guardar Cambios</button>
        </div>
    </div>

    <script>
        let isDirty = false;

        function markDirty() {
            isDirty = true;
            document.getElementById('save-status').textContent = '⚠️ Cambios sin guardar';
            document.getElementById('save-status').className = 'save-status';
        }

        async function loadFlows() {
            try {
                const res = await fetch('/api/flows');
                const data = await res.json();
                document.getElementById('json-editor').value = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('json-editor').value = '// Error cargando flujos';
            }
        }

        async function saveAllFlows() {
            try {
                const rawJson = document.getElementById('json-editor').value;
                const parsedData = JSON.parse(rawJson); // Validar JSON
                
                const res = await fetch('/api/flows', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(parsedData)
                });
                const data = await res.json();
                if (data.success) {
                    isDirty = false;
                    document.getElementById('save-status').textContent = '✅ Guardado exitosamente';
                    document.getElementById('save-status').className = 'save-status saved';
                } else {
                    alert('Error: ' + (data.error || 'desconocido'));
                }
            } catch (err) {
                alert('❌ Error: El JSON es inválido. Revisa las comillas y comas.\n\n' + err.message);
            }
        }

        // Prevenir salir sin guardar
        window.onbeforeunload = () => isDirty ? '¿Seguro?' : null;

        loadFlows();
    </script>
</body>
</html>
