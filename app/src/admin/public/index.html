<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDKeysPeru — WhatsApp Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a25;
            --border: #2a2a3a;
            --text: #e4e4ed;
            --text-muted: #8888a0;
            --accent: #25D366;
            --accent-dim: #1a9e4a;
            --red: #ef4444;
            --blue: #3b82f6;
            --gold: #f59e0b;
            --radius: 12px;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Header ────────────────────────────── */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span { color: var(--accent); }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .status-on {
            background: rgba(37, 211, 102, 0.15);
            color: var(--accent);
        }

        .status-off {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-on .status-dot { background: var(--accent); }
        .status-off .status-dot { background: var(--red); animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Stats Grid ────────────────────────── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: border-color 0.2s;
        }

        .stat-card:hover { border-color: var(--accent); }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .stat-value.green { color: var(--accent); }
        .stat-value.blue { color: var(--blue); }
        .stat-value.gold { color: var(--gold); }

        /* ── Controls ──────────────────────────── */
        .controls {
            padding: 0 24px 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { border-color: var(--accent); background: var(--surface2); }
        .btn-danger:hover { border-color: var(--red); }

        .btn-accent {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-accent:hover { background: var(--accent-dim); }

        /* ── Main Layout ───────────────────────── */
        .main {
            display: grid;
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 72px);
        }

        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; }
            .chat-panel { display: none; }
            .chat-panel.active { display: flex; }
        }

        /* ── Conversations List ────────────────── */
        .conv-list {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            background: var(--surface);
        }

        .conv-list-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
        }

        .conv-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .conv-item:hover { background: var(--surface2); }
        .conv-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }

        .conv-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .conv-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        .conv-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .conv-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
        }

        .badge-ai {
            background: rgba(37, 211, 102, 0.15);
            color: var(--accent);
        }

        .badge-human {
            background: rgba(245, 158, 11, 0.15);
            color: var(--gold);
        }

        .state-badge {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .state-waiting_payment { color: var(--gold); border-color: rgba(245, 158, 11, 0.3); }
        .state-delivered { color: var(--accent); border-color: rgba(37, 211, 102, 0.3); }
        .state-payment { color: var(--blue); border-color: rgba(59, 130, 246, 0.3); }
        .state-product_info { color: #a855f7; border-color: rgba(168, 85, 247, 0.3); }

        /* ── Chat Panel ────────────────────────── */
        .chat-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        .chat-header {
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-contact-name {
            font-weight: 600;
            font-size: 16px;
        }

        .chat-contact-phone {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        .msg-incoming {
            background: var(--surface2);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing {
            background: rgba(37, 211, 102, 0.15);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-outgoing.ai {
            border-left: 2px solid var(--accent);
        }

        .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Empty State ───────────────────────── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 12px;
        }

        .empty-icon { font-size: 48px; }

        /* ── Loading ───────────────────────────── */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>🤖 <span>CDKeysPeru</span> — WhatsApp Auto</h1>
        <div id="ai-status" class="status-badge status-on">
            <div class="status-dot"></div>
            <span>IA Activa</span>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Mensajes Hoy</div>
            <div class="stat-value green" id="stat-messages">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Entrantes</div>
            <div class="stat-value blue" id="stat-incoming">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Respuestas IA</div>
            <div class="stat-value gold" id="stat-ai">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Contactos</div>
            <div class="stat-value" id="stat-contacts">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Chats Activos</div>
            <div class="stat-value green" id="stat-active">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Flujos Activos</div>
            <div class="stat-value gold" id="stat-engine">—</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn btn-accent" id="btn-toggle-ai" onclick="toggleGlobalAI()">
            ⚡ Toggle Auto-Responder
        </button>
        <button class="btn" onclick="window.location.href='/flows'">
            📋 Editar Flujos
        </button>
        <button class="btn" onclick="loadData()">
            🔄 Refrescar
        </button>
        <button class="btn" onclick="triggerBackup()">
            💾 Backup Manual
        </button>
    </div>

    <!-- Main Layout -->
    <div class="main">
        <!-- Conversation List -->
        <div class="conv-list" id="conv-list">
            <div class="conv-list-header">💬 Conversaciones</div>
            <div class="loading"><div class="spinner"></div> Cargando...</div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chat-panel">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <p>Selecciona una conversación</p>
            </div>
        </div>
    </div>

    <script>
        let globalAIEnabled = true;
        let currentConvId = null;

        // ── Cargar datos ──────────────────────────
        async function loadData() {
            await Promise.all([loadStats(), loadConversations()]);
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('stat-messages').textContent = data.messages_today || 0;
                document.getElementById('stat-incoming').textContent = data.incoming_today || 0;
                document.getElementById('stat-ai').textContent = data.ai_responses_today || 0;
                document.getElementById('stat-contacts').textContent = data.total_contacts || 0;
                document.getElementById('stat-active').textContent = data.active_conversations || 0;
                document.getElementById('stat-engine').textContent = data.ai?.flows_count || 0;

                globalAIEnabled = data.ai_enabled_global;
                updateAIStatusBadge();
            } catch (err) {
                console.error('Error cargando stats:', err);
            }
        }

        async function loadConversations() {
            try {
                const res = await fetch('/api/conversations');
                const convs = await res.json();
                const list = document.getElementById('conv-list');
                
                list.innerHTML = '<div class="conv-list-header">💬 Conversaciones (' + convs.length + ')</div>';

                if (convs.length === 0) {
                    list.innerHTML += '<div class="empty-state" style="padding:40px"><p>Sin conversaciones aún</p></div>';
                    return;
                }

                for (const conv of convs) {
                    const time = new Date(conv.last_message_at).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
                    const badge = conv.ai_enabled 
                        ? '<span class="conv-badge badge-ai">Auto</span>'
                        : '<span class="conv-badge badge-human">Manual</span>';

                    const stateLabels = {
                        'new': 'Nuevo', 'catalog': 'Viendo Catálogo', 
                        'product_info': 'Viendo Producto', 'payment': 'Info de Pago',
                        'waiting_payment': '⏳ Esperando Pago', 'delivered': '✅ Entregado',
                        'human_takeover': '🙋 Humano', 'done': 'Completado'
                    };
                    const stateLabel = stateLabels[conv.conversation_state] || conv.conversation_state || 'Nuevo';

                    list.innerHTML += `
                        <div class="conv-item ${conv.id === currentConvId ? 'active' : ''}" 
                             onclick="selectConversation(${conv.id}, '${(conv.name || '').replace(/'/g, "\\'")}', '${conv.phone}', ${conv.contact_id}, ${conv.ai_enabled})">
                            <div class="conv-name">
                                <span>${conv.name || conv.phone}</span>
                                ${badge}
                            </div>
                            <div class="conv-preview">${conv.last_direction === 'incoming' ? '📨' : '📤'} ${(conv.last_message || '').substring(0, 60)}</div>
                            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                                <div class="state-badge state-${conv.conversation_state}">${stateLabel}</div>
                                <div class="conv-time">${time}</div>
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error cargando conversaciones:', err);
            }
        }

        async function selectConversation(convId, name, phone, contactId, aiEnabled) {
            currentConvId = convId;
            
            try {
                const res = await fetch(`/api/conversations/${convId}/messages`);
                const messages = await res.json();
                const panel = document.getElementById('chat-panel');

                panel.innerHTML = `
                    <div class="chat-header">
                        <div>
                            <div class="chat-contact-name">${name || phone}</div>
                            <div class="chat-contact-phone">${phone}</div>
                        </div>
                        <div style="display:flex;gap:8px">
                            <button class="btn ${aiEnabled ? 'btn-danger' : 'btn-accent'}" 
                                    onclick="toggleContactAI(${contactId}, ${!aiEnabled})">
                                ${aiEnabled ? '🙋 Tomar Control' : '🤖 Devolver a IA'}
                            </button>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages"></div>
                `;

                const msgContainer = document.getElementById('chat-messages');
                for (const msg of messages) {
                    const time = new Date(msg.created_at).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
                    const isOutgoing = msg.direction === 'outgoing';
                    const aiClass = msg.ai_generated ? ' ai' : '';

                    msgContainer.innerHTML += `
                        <div class="msg-bubble ${isOutgoing ? 'msg-outgoing' + aiClass : 'msg-incoming'}">
                            ${msg.content}
                            <div class="msg-time">${time} ${msg.ai_generated ? '🤖' : ''}</div>
                        </div>
                    `;
                }

                // Scroll al fondo
                msgContainer.scrollTop = msgContainer.scrollHeight;

                // Actualizar lista
                loadConversations();
            } catch (err) {
                console.error('Error cargando mensajes:', err);
            }
        }

        // ── Acciones ──────────────────────────────
        async function toggleGlobalAI() {
            try {
                const newState = !globalAIEnabled;
                await fetch('/api/settings/toggle-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled: newState })
                });
                globalAIEnabled = newState;
                updateAIStatusBadge();
            } catch (err) {
                console.error('Error toggling AI:', err);
            }
        }

        async function toggleContactAI(contactId, enabled) {
            try {
                await fetch(`/api/contacts/${contactId}/toggle-ai`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                loadConversations();
                if (currentConvId) {
                    // Recargar chat actual
                    const items = document.querySelectorAll('.conv-item.active');
                    if (items.length > 0) items[0].click();
                }
            } catch (err) {
                console.error('Error toggling contact AI:', err);
            }
        }

        async function triggerBackup() {
            try {
                const res = await fetch('/api/backup', { method: 'POST' });
                const data = await res.json();
                alert(data.success ? '💾 Backup creado exitosamente' : '❌ Error en backup');
            } catch (err) {
                alert('❌ Error creando backup');
            }
        }

        function updateAIStatusBadge() {
            const badge = document.getElementById('ai-status');
            if (globalAIEnabled) {
                badge.className = 'status-badge status-on';
                badge.innerHTML = '<div class="status-dot"></div><span>Auto Activo</span>';
            } else {
                badge.className = 'status-badge status-off';
                badge.innerHTML = '<div class="status-dot"></div><span>Auto Pausado</span>';
            }
        }

        // ── Auto-refresh cada 10 segundos ─────────
        loadData();
        setInterval(loadData, 10000);
    </script>
</body>
</html>
